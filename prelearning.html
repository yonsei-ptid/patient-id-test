<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>환자확인 완전학습 프로그램</title>

<!--
====================================================================
  환자확인 완전학습 프로그램 — 마이크로 러닝
  ------------------------------------------------------------------
  1. 아래 CONFIG 부분만 수정하면 바로 사용할 수 있습니다.
     프로그램 이름도 CONFIG.PROGRAM_NAME 에서 바꿉니다.
  2. 이 파일 하나만 웹서버에 올리면 됩니다. (설치 불필요)
====================================================================
-->

<link rel="stylesheet" as="style" crossorigin
 href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">

<style>
:root{
  /* 연세 블루 계열 */
  --navy:#00295C;        /* 가장 깊은 톤 — 시작·완료 화면 */
  --blue:#003876;        /* 기본 */
  --blue-mid:#1B5AA0;    /* 상호작용 */
  --blue-soft:#E7EEF7;   /* 옅은 면 */
  --blue-line:#C6D5E8;

  --paper:#F5F8FB;
  --surface:#FFFFFF;
  --ink:#0E2340;
  --ink-soft:#5A7292;
  --line:#DCE5EF;

  --ok:#186B4E;
  --ok-bg:#E4F0EB;
  --no:#9E3229;
  --no-bg:#F8E8E6;

  --maxw:800px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,
              'Malgun Gothic','맑은 고딕',sans-serif;
  font-size:16px;
  line-height:1.72;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3{margin:0;line-height:1.3;font-weight:700;letter-spacing:-0.025em;}
button{font-family:inherit;font-size:inherit;cursor:pointer;}
:focus-visible{outline:3px solid var(--blue-mid);outline-offset:3px;}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}

/* ============ 시작 화면 (대상자 코드 입력) ============ */
#gate{
  min-height:100vh;
  background:var(--navy);
  color:#fff;
  display:flex;align-items:center;
  position:relative;
  overflow:hidden;
}
/* 환자 팔찌를 연상시키는 얇은 띠 — 장식이 아니라 프로그램의 소재 */
#gate::before{
  content:"";position:absolute;inset:0 0 auto;height:3px;
  background:linear-gradient(90deg,#1B5AA0 0 16.6%,#2E74C0 0 33.3%,
             #1B5AA0 0 50%,#2E74C0 0 66.6%,#1B5AA0 0 83.3%,#2E74C0 0);
  opacity:.9;
}
#gate .wrap{width:100%;padding-top:64px;padding-bottom:64px;}

/* 프로그램 이름 — 크기를 바꾸려면 가운데 vw 값을 조절하세요 */
#progName{
  font-size:clamp(26px,4.4vw,38px);
  font-weight:800;color:#fff;
  letter-spacing:-0.035em;line-height:1.2;
  margin:0 0 18px;
  max-width:24ch;
}
.subhead{
  font-size:clamp(18px,2.4vw,23px);
  font-weight:600;color:#7FA9D8;
  margin:0 0 26px;letter-spacing:-0.015em;
}
#gate .desc{
  color:#B9CEE7;margin:0 0 44px;max-width:48ch;font-size:16.5px;
}
#gate .desc b{color:#fff;font-weight:600;}

.field{display:block;margin-bottom:10px;font-size:14px;color:#8FB3DC;}
#sidInput{
  width:100%;max-width:360px;padding:16px 18px;
  font-family:inherit;font-size:21px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:.08em;
  border:none;border-radius:6px;
  background:#fff;color:var(--ink);
}
#sidInput::placeholder{color:#A9B9CC;font-weight:400;letter-spacing:.04em;}
.hint{font-size:13.5px;color:#8FB3DC;margin:14px 0 0;max-width:48ch;}
.err{color:#FFAFA6;font-size:14px;margin:12px 0 0;min-height:1.4em;}

.btn{
  background:var(--blue-mid);color:#fff;border:none;
  padding:15px 34px;border-radius:6px;
  font-weight:600;font-size:16px;
  transition:background .18s;
}
.btn:hover:not(:disabled){background:#2E74C0;}
.btn:disabled{background:#B8C6D6;cursor:not-allowed;}
#startBtn{margin-top:26px;}

/* ============ 상단 진행 ============ */
#topbar{
  position:sticky;top:0;z-index:50;
  background:var(--navy);color:#fff;
}
#topbar .inner{
  max-width:var(--maxw);margin:0 auto;padding:13px 24px;
  display:flex;align-items:center;gap:20px;
}
#barName{font-size:14px;font-weight:600;white-space:nowrap;}
#ticks{display:flex;gap:4px;flex:1;min-width:80px;}
.tick{height:4px;flex:1;background:rgba(255,255,255,.22);border-radius:2px;
      transition:background .3s;}
.tick.done{background:#5C94D6;}
.tick.now{background:#fff;}
#sidTag{font-size:13px;color:#8FB3DC;white-space:nowrap;
        font-variant-numeric:tabular-nums;}

/* ============ 챕터 ============ */
#course{display:none;padding:44px 0 110px;}

.chapter{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:8px;
  margin-bottom:14px;
}
.chapter.active{border-color:var(--blue-line);box-shadow:0 2px 14px rgba(0,41,92,.07);}

.chead{display:flex;align-items:baseline;gap:16px;padding:22px 26px;}
.cnum{
  font-size:15px;font-weight:700;color:var(--blue-line);
  font-variant-numeric:tabular-nums;flex-shrink:0;min-width:1.4em;
}
.chapter.active .cnum{color:var(--blue);}
.chapter.done  .cnum{color:var(--blue-mid);}
.chead h2{font-size:19.5px;flex:1;}
.chapter.locked .chead h2{color:#9DAFC4;}
.cstate{font-size:13px;color:var(--ink-soft);flex-shrink:0;}
.chapter.done .cstate{color:var(--blue-mid);font-weight:600;}

.cbody{padding:0 26px 28px;}
.chapter.locked .cbody{display:none;}

/* 영상 */
.videobox{background:#001A3B;border-radius:6px;overflow:hidden;}
.videobox video{display:block;width:100%;height:auto;background:#001A3B;}
.novideo{padding:56px 24px;text-align:center;color:#7C9BC4;
         font-size:14.5px;line-height:1.9;}
.vmeta{display:flex;align-items:center;gap:14px;
       font-size:13.5px;color:var(--ink-soft);padding:12px 2px 22px;}
.vbar{height:4px;background:var(--line);border-radius:2px;flex:1;overflow:hidden;}
.vbar i{display:block;height:100%;width:0;background:var(--blue-mid);
        transition:width .25s;}

/* 문항 */
.q{border-top:1px solid var(--line);padding-top:24px;margin-top:2px;}
.qtext{font-weight:600;margin:0 0 18px;font-size:16.5px;line-height:1.6;}

.opt{
  display:flex;gap:13px;width:100%;text-align:left;
  background:var(--surface);
  border:1.5px solid var(--line);border-radius:6px;
  padding:14px 16px;margin-bottom:9px;
  color:var(--ink);line-height:1.6;
  transition:border-color .15s,background .15s;
}
.opt:hover:not(:disabled){border-color:var(--blue-mid);background:#FAFCFE;}
.opt:disabled{cursor:default;}
.opt .mark{
  flex-shrink:0;width:23px;height:23px;border-radius:50%;
  border:1.5px solid var(--blue-line);
  display:grid;place-items:center;font-size:12.5px;font-weight:600;
  margin-top:1px;color:var(--blue-mid);
  font-variant-numeric:tabular-nums;
}
.opt.picked-ok{border-color:var(--ok);background:var(--ok-bg);}
.opt.picked-ok .mark{border-color:var(--ok);background:var(--ok);color:#fff;}
.opt.picked-no{border-color:var(--no);background:var(--no-bg);}
.opt.picked-no .mark{border-color:var(--no);background:var(--no);color:#fff;}
.opt.reveal-ok{border-color:var(--ok);}
.opt.reveal-ok .mark{border-color:var(--ok);color:var(--ok);}

.fb{margin-top:16px;padding:15px 17px;border-radius:6px;
    font-size:15px;line-height:1.75;}
.fb.ok{background:var(--ok-bg);color:var(--ok);}
.fb.no{background:var(--no-bg);color:var(--no);}
.fb.hidden{display:none;}
.nextrow{margin-top:22px;}

/* ============ 완료 ============ */
#done{display:none;min-height:100vh;background:var(--navy);color:#fff;
      align-items:center;}
#done.show{display:flex;}
#done .wrap{width:100%;padding-top:64px;padding-bottom:64px;}
#done h1{font-size:clamp(27px,4.6vw,38px);font-weight:800;margin-bottom:20px;}
#done p{color:#B9CEE7;margin:0 0 12px;max-width:46ch;}
#scoreline{
  font-size:17px;color:#fff;margin:34px 0 30px;font-weight:600;
  font-variant-numeric:tabular-nums;
  padding-top:26px;border-top:1px solid rgba(255,255,255,.18);
}
#sendState{font-size:13.5px;color:#8FB3DC;margin-top:26px;min-height:1.4em;}

@media (max-width:600px){
  .chead,.cbody{padding-left:19px;padding-right:19px;}
  #topbar .inner{gap:12px;}
  #barName{display:none;}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>

<!-- 상단 진행 -->
<div id="topbar" hidden>
  <div class="inner">
    <span id="barName"></span>
    <div id="ticks"></div>
    <span id="sidTag"></span>
  </div>
</div>

<!-- 시작 화면 (대상자 코드 입력) -->
<section id="gate">
  <div class="wrap">
    <h1 id="progName"></h1>
    <p class="subhead">마이크로 러닝을 시작합니다</p>

    <p class="desc" style="margin-bottom:8px">
      환자확인과 관련된 짧은 마이크로 러닝 시청 후 문항에 답을 하세요.
    </p>
    <p class="desc">
      <b>영상을 끝까지 봐야 문항이 열리며</b> 약 30분의 학습시간이 소요됩니다.
    </p>

    <label class="field" for="sidInput">연구 대상자 코드</label>
    <input id="sidInput" type="text" autocomplete="off"
           placeholder="S01" maxlength="4" spellcheck="false">
    <p class="hint" id="codeHint"></p>
    <p class="err" id="gateErr"></p>
    <button class="btn" id="startBtn">마이크로 러닝 시작</button>
  </div>
</section>

<!-- 챕터 -->
<section id="course"><div class="wrap" id="courseInner"></div></section>

<!-- 완료 -->
<section id="done">
  <div class="wrap">
    <h1>마이크로 러닝을 마쳤습니다</h1>
    <p>이어서 시뮬레이션을 진행하세요. 대상자 코드는 자동으로 넘어갑니다.</p>
    <p id="scoreline"></p>
    <button class="btn" id="goSim">시뮬레이션으로 이동</button>
    <p id="sendState"></p>
  </div>
</section>

<script>
/* ==================================================================
   CONFIG — 여기만 고치면 됩니다
   ================================================================== */
const CONFIG = {

  // 프로그램 이름 (화면 상단, 브라우저 탭 제목에 함께 반영됩니다)
  PROGRAM_NAME: "환자확인 완전학습 프로그램",

  // 연구 대상자 코드 형식 — 접두어 + 두 자리 번호 (예: S01 ~ S50)
  // 개인정보를 수집하지 않기 위해 이 코드를 사용합니다.
  CODE_PREFIX: "S",
  CODE_MIN: 1,
  CODE_MAX: 50,

  // 스프레드시트 전송 주소 (Apps Script 웹 앱 URL, /exec 로 끝납니다)
  // 비워두면 전송하지 않고 화면에만 표시합니다.
    ENDPOINT: "https://script.google.com/macros/s/AKfycbwsarji-U191NVlSpzaggVlMxlShNEe0Hd6F_SACKMfgLBUiI_SSAM2on-jVhrg9XD8Tg/exec",

  // 마이크로 러닝을 마친 뒤 이동할 주소.
  // 대상자 코드가 ?sid= 로 자동으로 붙어서 넘어갑니다.
  //
  // Unity 웹 빌드를 sim 폴더에 넣었습니다.
  SIM_URL: "sim/index.html",

  // 영상 주소 — 챕터 1~6 순서대로.
  // 이 파일과 같은 폴더에 두면 파일 이름만 적으면 됩니다.
  // 비워두면 그 챕터는 영상 없이 문항만 열립니다.
  VIDEOS: [
    "1.mp4",   // 1. 환자확인 원칙
    "2.mp4",   // 2. 입원 등록 시
    "3.mp4",   // 3. 진단검사 전
    "4.mp4",   // 4. 처치 및 간호중재 전
    "5.mp4",   // 5. 퇴원 시
    "6.mp4"    // 6. 전문직 책임과 오류 재발 방지
  ],

  // 선택지 순서를 무작위로 섞습니다.
  // 원문은 정답이 대부분 3번이라 찍기가 가능합니다. 끄려면 false.
  SHUFFLE: true,

  // 영상 앞으로 감기 차단 (되감기는 허용)
  NO_SKIP: true,

  // 개발 중 영상 시청 강제를 끄려면 true. 실제 운영 시 반드시 false.
  DEV_SKIP_VIDEO: false
};

/* ==================================================================
   문항 — 마이크로러닝 대본 원문 그대로입니다.

   ※ 확인 필요: 6장 Q2는 "부합하지 않는 것"을 묻는데 ①②④가 모두
     부합하지 않습니다. 원문을 고치지 않고 그대로 두되 ①을 정답으로
     처리했습니다. 사용 전에 문항을 손보세요.
   ================================================================== */
const CHAPTERS = [
{
  title:"환자확인 원칙",
  questions:[
    { id:"C1Q1",
      text:"다음 중 환자확인의 기본 원칙으로 가장 적절한 것은 무엇인가?",
      options:[
        "병실번호와 침상번호를 이용해 환자 확인을 한다",
        "차트와 라벨을 이용해 환자 확인을 한다",
        "두 가지 이상의 개인 고유 식별자로 환자 확인을 한다",
        "환자확인은 입원 시 한 번만 시행하면 된다"
      ],
      answer:2,
      why:"환자확인은 이름과 생년월일, 또는 이름과 환자등록번호처럼 두 가지 이상의 고유 식별자로 확인합니다. 병실번호와 침상번호는 환자 고유 정보가 아니므로 식별자로 쓰지 않습니다."
    },
    { id:"C1Q2",
      text:"다음 상황 중 환자확인 원칙을 가장 올바르게 적용한 경우는 무엇인가?",
      options:[
        "간호사가 팔찌에 적힌 이름을 읽어주며 “OOO님 맞으시죠?”라고 묻고 투약을 시행했다.",
        "간호사가 차트와 검사 라벨의 이름이 일치함을 확인한 후 바로 검사를 시행했다.",
        "간호사가 환자의 직접 응답을 통해 식별정보를 확인하고, 검사 처방과 일치를 확인했다.",
        "간호사가 병실 명단을 확인한 후 처치를 시행했다."
      ],
      answer:2,
      why:"환자가 직접 자신의 정보를 말하도록 하고, 그 정보가 시행할 의료행위와 일치하는지까지 확인해야 합니다. 확인해 주기를 요청하는 폐쇄형 질문이나 서류 대조만으로는 환자확인이 성립하지 않습니다."
    }
  ]
},
{
  title:"입원 등록 시 환자확인",
  questions:[
    { id:"C2Q1",
      text:"다음 중 입원 단계에서 환자확인이 중요한 이유로 가장 적절한 것은 무엇인가?",
      options:[
        "입원 단계에서는 환자확인을 한 번만 수행하면 되기 때문이다",
        "입원 단계에서 생성된 환자 정보는 이후 의료행위에 반복적으로 사용되기 때문이다",
        "입원 단계에서는 검사와 처치가 거의 이루어지지 않기 때문이다",
        "환자 팔찌는 입원 후 언제든 다시 만들 수 있기 때문이다"
      ],
      answer:1,
      why:"입원 단계는 환자 정보가 처음 생성되는 시점입니다. 이때의 오류는 이후 검사, 처치, 간호 전 과정에 반복적으로 영향을 미칩니다."
    },
    { id:"C2Q2",
      text:"입원 단계에서 병동 내 동명이인 환자가 확인된 경우, 가장 올바른 환자확인 방법은 무엇인가?",
      options:[
        "환자 팔찌에 적힌 이름을 확인한 후 입원을 진행한다",
        "환자가 직접 응답하기 어려운 경우 보호자의 확인으로 환자확인을 대신한다",
        "이름과 생년월일을 확인한 뒤 EMR 동명이인 경고를 확인한다",
        "병실번호와 팔찌 정보를 함께 확인하여 환자를 구분한다"
      ],
      answer:2,
      why:"동명이인 상황에서는 이름 외 추가 식별자를 확인하고 EMR 경고를 확인해야 합니다. 환자가 직접 응답하기 어려운 경우에도 팔찌와 의무기록을 기본으로 하고 보호자 확인은 보조적으로만 활용합니다."
    }
  ]
},
{
  title:"진단검사 전 환자확인",
  questions:[
    { id:"C3Q1",
      text:"다음 중 진단검사 전 환자확인 원칙으로 가장 적절한 것은 무엇인가?",
      options:[
        "검사 일정표를 확인한 후 검사를 시행한다",
        "검사 라벨과 차트가 일치하면 환자확인을 생략한다",
        "두 가지 이상의 식별자로 환자의 직접 응답을 통해 확인한다",
        "병실번호와 침상번호로 환자를 구분한다"

const state = { sid:"", idx:0, log:[], startedAt:new Date() };
const $ = s => document.querySelector(s);

/* 프로그램 이름 적용 */
document.title             = CONFIG.PROGRAM_NAME;
$("#progName").textContent = CONFIG.PROGRAM_NAME;
$("#barName").textContent  = CONFIG.PROGRAM_NAME;

/* ---------- 대상자 코드 입력 ---------- */
const CODE_RANGE = CONFIG.CODE_PREFIX + pad(CONFIG.CODE_MIN)
                 + " ~ " + CONFIG.CODE_PREFIX + pad(CONFIG.CODE_MAX);

$("#codeHint").textContent =
  `연구 담당자가 부여한 코드를 입력하세요. ${CODE_RANGE} 범위입니다. `
  + `이 코드로 마이크로 러닝, 시뮬레이션, 성찰일지 기록이 연결되므로 `
  + `정확히 확인하고 시작하세요.`;

$("#startBtn").addEventListener("click", start);
$("#sidInput").addEventListener("keydown", e => { if(e.key==="Enter") start(); });

// 소문자로 입력해도 자동으로 대문자가 됩니다
$("#sidInput").addEventListener("input", e => {
  e.target.value = e.target.value.toUpperCase().replace(/\s/g,"");
});

function normalizeCode(raw){
  let v = String(raw).trim().toUpperCase();
  if(!v) return null;

  // 숫자만 입력한 경우에도 접두어를 붙여 줍니다 (예: 7 → S07)
  if(/^\d+$/.test(v)) v = CONFIG.CODE_PREFIX + v;

  const m = v.match(new RegExp("^" + CONFIG.CODE_PREFIX + "(\\d{1,3})$"));
  if(!m) return null;

  const n = parseInt(m[1], 10);
  if(n < CONFIG.CODE_MIN || n > CONFIG.CODE_MAX) return null;

  return CONFIG.CODE_PREFIX + pad(n);
}

function start(){
  const code = normalizeCode($("#sidInput").value);
  if(!code){
    $("#gateErr").textContent = `${CODE_RANGE} 범위의 코드를 입력하세요.`;
    $("#sidInput").focus();
    return;
  }
  $("#gateErr").textContent = "";
  $("#sidInput").value = code;
  state.sid = code;
  $("#gate").style.display = "none";
  $("#course").style.display = "block";
  $("#topbar").hidden = false;
  $("#sidTag").textContent = code;
  buildTicks();
  buildChapters();
  openChapter(0);
}

function buildTicks(){
  $("#ticks").innerHTML = CHAPTERS.map(()=>`<span class="tick"></span>`).join("");
}
function paintTicks(){
  document.querySelectorAll(".tick").forEach((el,i)=>{
    el.className = "tick" + (i < state.idx ? " done" : i === state.idx ? " now" : "");
  });
}

/* ---------- 챕터 ---------- */
function buildChapters(){
  $("#courseInner").innerHTML = CHAPTERS.map((ch,i)=>`
    <article class="chapter locked" id="ch${i}">
      <div class="chead">
        <span class="cnum">${i+1}</span>
        <h2>${ch.title}</h2>
        <span class="cstate" id="st${i}">잠김</span>
      </div>
      <div class="cbody" id="body${i}"></div>
    </article>`).join("");
}

function openChapter(i){
  state.idx = i;
  paintTicks();

  const el  = $("#ch"+i);
  const box = $("#body"+i);
  el.classList.remove("locked");
  el.classList.add("active");
  $("#st"+i).textContent = "진행 중";

  const url = CONFIG.VIDEOS[i] || "";
  const hasVideo = url && !CONFIG.DEV_SKIP_VIDEO;

  box.innerHTML = `
    <div class="videobox" id="vb${i}"></div>
    <div class="vmeta">
      <div class="vbar"><i id="vp${i}"></i></div>
      <span id="vs${i}">${hasVideo ? "영상을 끝까지 보면 문항이 열립니다"
                                   : "영상 없음 — 문항이 바로 열립니다"}</span>
    </div>
    <div id="qs${i}"></div>`;

  if(hasVideo){
    $("#vb"+i).innerHTML =
      `<video id="v${i}" playsinline controls preload="metadata" src="${url}"></video>`;
    gateVideo(i);
  }else{
    $("#vb"+i).innerHTML =
      `<div class="novideo">영상 주소가 설정되지 않았습니다.<br>
       파일 위쪽 CONFIG.VIDEOS 에 주소를 넣으세요.</div>`;
    $("#vp"+i).style.width = "100%";
    showQuestion(i,0);
  }

  el.scrollIntoView({behavior:"smooth", block:"start"});
}

function gateVideo(i){
  const v = $("#v"+i);
  let watched = 0;
  let opened  = false;   // [수정] 이 챕터의 문항을 이미 열었는지 기억합니다

  // [수정] 앞으로 넘기면 보던 위치로 되돌리고 안내합니다
  function blockSkip(){
    v.currentTime = watched;
    $("#vs"+i).textContent = "앞으로 감기는 할 수 없습니다. 영상을 끝까지 보면 문항이 열립니다";
  }

  v.addEventListener("timeupdate", ()=>{
    const t = v.currentTime;
    // [수정] 재생 막대를 끌어 앞으로 넘긴 경우 (일부 브라우저는 seeking보다 이 신호가 먼저 옴)
    if(CONFIG.NO_SKIP && t > watched + 3){
      blockSkip();
      return;
    }
    if(!v.seeking && t > watched) watched = t;
    if(v.duration) $("#vp"+i).style.width = (watched / v.duration * 100) + "%";
  });

  if(CONFIG.NO_SKIP){
    v.addEventListener("seeking", ()=>{
      if(v.currentTime > watched + 3) blockSkip();
    });
  }

  v.addEventListener("ended", ()=>{
    // [수정] 끝까지 보지 않고 끝으로 넘긴 경우에는 문항을 열지 않습니다
    if(CONFIG.NO_SKIP && v.duration && watched < v.duration - 2){
      blockSkip();
      return;
    }

    $("#vp"+i).style.width = "100%";
    $("#vs"+i).textContent = "시청 완료";

    // [수정] 영상을 다시 재생해 끝까지 봐도 문항은 처음 한 번만 엽니다
    if(opened) return;
    opened = true;
    showQuestion(i,0);
  });

  v.addEventListener("error", ()=>{
    $("#vs"+i).textContent = "영상을 불러오지 못했습니다. 주소를 확인하세요.";
  });
}

/* ---------- 문항 ---------- */
function showQuestion(ci, qi){
  // [수정] 이미 화면에 만들어진 문항이면 다시 만들지 않습니다 (이중 안전장치)
  if(document.getElementById(`opts_${ci}_${qi}`)) return;

  const q  = CHAPTERS[ci].questions[qi];
  let order = q.options.map((_,k)=>k);
  if(CONFIG.SHUFFLE) order = shuffle(order);

  const div = document.createElement("div");
  div.className = "q";
  div.innerHTML = `
    <p class="qtext">${q.text}</p>
    <div id="opts_${ci}_${qi}">
      ${order.map((orig,pos)=>`
        <button class="opt" data-orig="${orig}">
          <span class="mark">${pos+1}</span>
          <span>${q.options[orig]}</span>
        </button>`).join("")}
    </div>
    <div class="fb hidden" id="fb_${ci}_${qi}"></div>
    <div class="nextrow" id="nx_${ci}_${qi}"></div>`;
  $("#qs"+ci).appendChild(div);

  div.querySelectorAll(".opt").forEach(btn=>{
    btn.addEventListener("click", ()=> answer(ci, qi, +btn.dataset.orig, btn));
  });
  div.scrollIntoView({behavior:"smooth", block:"center"});
}

function answer(ci, qi, chosen, btn){
  const q  = CHAPTERS[ci].questions[qi];
  const ok = chosen === q.answer;

  document.querySelectorAll(`#opts_${ci}_${qi} .opt`).forEach(b=>{
    b.disabled = true;
    if(+b.dataset.orig === q.answer && !ok) b.classList.add("reveal-ok");
  });
  btn.classList.add(ok ? "picked-ok" : "picked-no");

  const fb = $(`#fb_${ci}_${qi}`);
  fb.className = "fb " + (ok ? "ok" : "no");
  fb.textContent = (ok ? "정답입니다. " : "다시 확인해 봅시다. ") + q.why;

  state.log.push({
    itemId:q.id, chapter:ci+1,
    chosen:chosen+1, answer:q.answer+1, correct:ok
  });

  const last = qi === CHAPTERS[ci].questions.length - 1;
  const b = document.createElement("button");
  b.className = "btn";
  b.textContent = last
    ? (ci === CHAPTERS.length-1 ? "마이크로 러닝 마치기" : "다음 챕터로")
    : "다음 문항";
  b.addEventListener("click", ()=>{
    b.disabled = true;
    if(!last) showQuestion(ci, qi+1);
    else finishChapter(ci);
  });
  $(`#nx_${ci}_${qi}`).appendChild(b);
}

function finishChapter(ci){
  const el = $("#ch"+ci);
  el.classList.remove("active");
  el.classList.add("done");
  $("#st"+ci).textContent = "완료";
  if(ci === CHAPTERS.length-1) finishAll();
  else openChapter(ci+1);
}

/* ---------- 완료 ---------- */
function finishAll(){
  state.idx = CHAPTERS.length;
  paintTicks();
  $("#course").style.display = "none";
  $("#topbar").hidden = true;
  $("#done").classList.add("show");

  const total = state.log.length;
  const right = state.log.filter(r=>r.correct).length;
  $("#scoreline").textContent = `${total}문항 중 ${right}문항 정답`;

  window.scrollTo({top:0});
  send(right, total);

  $("#goSim").addEventListener("click", ()=>{
    if(!CONFIG.SIM_URL){
      $("#sendState").textContent =
        "다음 단계 주소가 설정되지 않았습니다. CONFIG.SIM_URL 을 확인하세요.";
      return;
    }
    const j = CONFIG.SIM_URL.includes("?") ? "&" : "?";
    location.href = CONFIG.SIM_URL + j + "sid=" + encodeURIComponent(state.sid);
  });
}

/* ---------- 전송 ---------- */
function send(right, total){
  if(!CONFIG.ENDPOINT){
    $("#sendState").textContent = "전송 주소가 없어 기록을 보내지 않았습니다.";
    return;
  }
  $("#sendState").textContent = "기록을 저장하는 중입니다…";

  const body = new URLSearchParams();
  body.append("type","microlearning");
  body.append("studentId", state.sid);
  body.append("score", right);
  body.append("total", total);
  body.append("startedAt", fmt(state.startedAt));
  body.append("finishedAt", fmt(new Date()));
  state.log.forEach(r=>{
    body.append("i_" + r.itemId, `${r.chosen}|${r.answer}|${r.correct ? 1 : 0}`);
  });

  fetch(CONFIG.ENDPOINT, {
    method:"POST", mode:"no-cors",
    headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
    body:body.toString()
  })
  .then(()=>{ $("#sendState").textContent = "기록을 저장했습니다."; })
  .catch(()=>{ $("#sendState").textContent = "저장에 실패했습니다. 담당자에게 알려주세요."; });
}

/* ---------- 도구 ---------- */
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function pad(n){
  return String(n).padStart(String(CONFIG.CODE_MAX).length, "0");
}
function fmt(d){
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} `
       + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
